# prerequisites (what to configure in AWS):
# for this YAML to work, you must set up the Trust Agreement inside
# your AWS account first:
# 1 - Identity Provider: Create an OIDC Identity Provider in AWS IAM
# pointing to https://githubusercontent.com
# 2 - IAM Role: Create an IAM Role (e.g., my-github-actions-role) 
# with a Trust Policy that allows your specific GitHub repository
# to assume it, see sample-trust-policy.json
# 3 - Permissions: Attach an IAM Policy to that role granting
# secretsmanager:GetSecretValue permissions for your database secret,
# see sample-permissions.json

name: Fetch AWS Secrets

on:
  push:
    branches:
      - dev

# Crucial: This grants permission to request the OIDC token from GitHub's OIDC provider
permissions:
  id-token: write
  contents: read

jobs:
  get-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 & 3: The Handshake. Exchanges GitHub's OIDC token for temporary AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role # Replace with your AWS Role ARN
          aws-region: us-east-1 # Replace with your AWS Region

      # Step 4 & 5: The Exchange. Pulls the secret from AWS Secrets Manager
      - name: Fetch Secret from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            DB_SECRET, arn:aws:secretsmanager:us-east-1:123456789012:secret:prod/db-credentials-xyz123
          parse-json-secrets: true # If your secret is stored as JSON (e.g., {"username": "admin", "password": "abc"})

      # Step 6: Use the secret. AWS automatically masks these variables as *** in logs
      - name: Use Secrets in Deployment
        run: |
          echo "Connecting to database..."
          # The secrets are now available as environment variables named after the JSON keys
          export DB_USER=${{ env.DB_SECRET_username }}
          export DB_PASS=${{ env.DB_SECRET_password }}
          
          # Run your deployment commands or backend startup scripts here
          npm run deploy