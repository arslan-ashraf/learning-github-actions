name: first-workflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Allows you to run this worflow from other workflows
  # it can be used as ${{ inputs.my_key_name }} in the current workflow
  # to use this workflow in another workflow, use the "use" keyword
  # use: <path_to_this_workflow>, with: my_key_name: <some_name>
  workflow_call: 
    inputs:         # inputs to this reusable workflow
      my_key_name:
        description: some description
        required: false
        default: some default value
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains two jobs called "build_job" and "info_job"
  build_job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Clones repo onto an ubuntu machine under $GITHUB_WORKSPACE, so your job can access it
      - name: Clone the repo
        uses: actions/checkout@v7

      - name: Print PATH
        run: echo $PATH | tr ':' '\n'

      - name: Where Docker is installed
        run: which docker

      - name: Print current Docker version
        run: docker --version

      - name: Cache the .deb Packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-docker-latest

      - name: Update Docker
        run: |
          echo "updating Docker"
          # sudo apt update
          # sudo apt install -y ca-certificates curl gnupg
          # sudo install -m 0755 -d /etc/apt/keyrings
          # curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          # sudo chmod a+r /etc/apt/keyrings/docker.gpg
          # echo \
          #   "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          #   https://download.docker.com/linux/ubuntu \
          #   $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          # sudo apt update
          # sudo apt install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Print new Docker version  
        run: docker --version

  docker_version_job:
    needs: build_job
    runs-on: ubuntu-latest

    steps:
      - name: Print Docker in Different Job
        run: docker --version

  info_job:
    runs-on: ubuntu-latest
    steps:
      - name: Output github context
        run: echo "${{ toJSON(github) }}"