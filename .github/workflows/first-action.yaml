name: first-workflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains two jobs called "build_job" and "info_job"
  build_job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Clones repo onto an ubuntu machine under $GITHUB_WORKSPACE, so your job can access it
      - name: Clone the repo
        uses: actions/checkout@v7

      - name: Print current Docker version
        run: docker --version

      - name: Update Docker
        run: |
          sudo apt update
          sudo apt install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  docker_version_job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Docker in Different Job
        run: docker --version
    
  info_job:
    runs-on: ubuntu-latest
    steps:
      - name: Output github context
        run: echo "${{ toJSON(github) }}"